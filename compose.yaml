services:
    db:
        image: mysql:8.1
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-rentmycar}
            MYSQL_USER: ${MYSQL_USER:-rentmycar}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rentmycar_dev}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
        ports:
            - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
        volumes:
            - mysql81_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

    phpmyadmin:
        image: phpmyadmin:5.2.3
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
        ports:
            - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
        depends_on:
            db:
                condition: service_healthy

volumes:
    mysql81_data:
