product: jvm/app

settings:
    ktor: enabled
    kotlin:
        serialization:
            enabled: true
    jvm:
        mainClass: com.rentmycar.ApplicationKt

dependencies:
    - $ktor.server.core
    - $ktor.server.netty
    - $ktor.server.config.yaml
    - ch.qos.logback:logback-classic:1.5.38
    - $ktor.server.contentNegotiation
    - $ktor.serialization.kotlinx.json
    - org.openfolder:kotlin-asyncapi-ktor:3.2.3
    - com.jayway.jsonpath:json-path:2.9.0
    - io.github.cdimascio:dotenv-kotlin:6.5.1
    - $ktor.server.auth
    - $ktor.server.auth.jwt
    - at.favre.lib:bcrypt:0.10.2

    # Exposed
    - org.jetbrains.exposed:exposed-core:1.6.0
    - org.jetbrains.exposed:exposed-jdbc:1.6.0
    - org.jetbrains.exposed:exposed-migration-jdbc:1.6.0
    - org.jetbrains.exposed:exposed-json:1.6.0
    - org.jetbrains.exposed:exposed-dao:1.6.0
    - org.jetbrains.exposed:exposed-kotlin-datetime:1.6.0
#    - org.jetbrains.exposed.v1.sql.CurrentDateTime

    # MySQL
    - com.mysql:mysql-connector-j:9.5.0

    # Flyway
    - org.flywaydb:flyway-core:11.0.0
    - org.flywaydb:flyway-mysql:11.0.0

test-dependencies:
    - org.testcontainers:testcontainers-mysql:2.0.5
    - $ktor.server.testHost
    - $ktor.client.contentNegotiation
